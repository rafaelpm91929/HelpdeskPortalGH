worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Aumentar el límite de tamaño de subida a 50 Megabytes
    client_max_body_size 50M;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # 1. Redirección Opcional HTTP (puerto 80) a HTTPS (puerto 443)
    # =========================================================================
    # server {
    #     listen       80;
    #     server_name  helpdesksmartsolutions.mooo.com juridico_gh.mooo.com;
    #     return 301 https://$host$request_uri;
    # }

    # =========================================================================
    # 2. Servidor Principal HTTPS - PORTAL AGENCIAS (helpdesksmartsolutions.mooo.com)
    # =========================================================================
    server {
        listen       443 ssl;
        server_name  helpdesksmartsolutions.mooo.com;

        # Certificados SSL en el servidor .97
        ssl_certificate      "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/backend/ssl/cert.pem";
        ssl_certificate_key  "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/backend/ssl/key.pem";

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Frontend compilado del PORTAL AGENCIAS
        location / {
            root   "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/frontend/dist";
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Redirigir llamadas API a Node.js (puerto 4000)
        location /api {
            proxy_pass https://127.0.0.1:4000/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
        }

        # Redirigir subida de imágenes y logos
        location /uploads {
            proxy_pass https://127.0.0.1:4000/uploads;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
        }

        # Acceso secundario por subruta /juridico en el mismo dominio
        location /juridico {
            alias  "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/juridico/front/dist";
            index  index.html index.htm;
            try_files $uri $uri/ /juridico/index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # =========================================================================
    # 3. Servidor HTTPS Exclusivo - PORTAL JURÍDICO (juridico_gh.mooo.com / juridico-gh.mooo.com)
    # =========================================================================
    server {
        listen       443 ssl;
        server_name  juridico_gh.mooo.com juridico-gh.mooo.com;

        # Certificados SSL en el servidor .97
        ssl_certificate      "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/backend/ssl/cert.pem";
        ssl_certificate_key  "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/backend/ssl/key.pem";

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Frontend compilado del PORTAL JURÍDICO (Alta Dirección)
        location / {
            root   "C:/Users/AdministradorVw1/Desktop/HelpdeskPortal/juridico/front/dist";
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
